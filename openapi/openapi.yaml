openapi: 3.0.3
info:
  title: Intranet Docente IES Ramón Arcas Meca
  description: |
    API REST de la Intranet de Gestión Docente (Proyecto Intermodular 2º DAW).

    Prefijo funcional `/api/v1`. Autenticación JWT Bearer salvo login/refresh/health.

    Roles: `admin`, `directiva`, `jefatura`, `docente`, `tutor`, `responsable_ticket`.
    FEM = Formación en Empresas Murcia (no renombrar a FCT).
  version: 0.1.0
  contact:
    name: Proyecto Intermodular DAW — IES Ramón Arcas Meca

servers:
  - url: http://localhost:8000
    description: Desarrollo local

tags:
  - name: Auth
    description: OAuth Google, JWT, sesión
  - name: Usuarios
    description: Claustro, perfil y horarios
  - name: Anuncios
    description: Tablón segmentado por departamento
  - name: Guardias
    description: Cuadrante y asignación
  - name: Ausencias
    description: Registro, justificante, PDF y firma
  - name: Tickets
    description: Solicitudes RMI / RRSS / Compras y comentarios
  - name: FEM
    description: Formación en Empresas Murcia — alumnado y horas
  - name: Dashboard
    description: KPIs para equipo directivo
  - name: Health
    description: Liveness y readiness (Docker)

paths:
  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Login con Google OAuth
      description: |
        Recibe `id_token` de Google Identity Services.
        Emite access JWT en el body y refresh en cookie HttpOnly `refresh_token`.
        Sin restriccion de dominio; usuarios nuevos quedan en estado `pendiente`.
      operationId: authGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
            example:
              id_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Access token emitido (refresh en Set-Cookie)
          headers:
            Set-Cookie:
              description: Cookie HttpOnly refresh_token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token
      description: |
        Lee la cookie HttpOnly `refresh_token` (no usa Bearer).
        Valida el token opaco en Redis y emite un nuevo access JWT.
      operationId: authRefresh
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Nuevo access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: Invalida el refresh en Redis y borra la cookie.
      operationId: authLogout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sesión invalidada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
              example:
                detail: Sesion cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Usuario autenticado
      description: Identidad y roles para el arranque de la PWA.
      operationId: authMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil del usuario del JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioMe'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/usuarios:
    get:
      tags: [Usuarios]
      summary: Listado del claustro
      description: Requiere rol admin. Admite filtro y paginacion.
      operationId: listUsuarios
      security:
        - BearerAuth: []
      parameters:
        - name: departamento
          in: query
          required: false
          schema:
            type: string
          description: Filtra por departamento
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Pagina de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Usuarios]
      summary: Alta manual de usuario
      description: El servidor asigna el id. Cabecera Location apunta al GET por id.
      operationId: createUsuario
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
            example:
              name: Pepa
              email: pepa@example.com
              departamento: FOL
              roles: [docente]
      responses:
        '201':
          description: Usuario creado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
                example: /api/v1/usuarios/64f1a2b3c4d5e6f7a8b9c0d3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/usuarios/me:
    get:
      tags: [Usuarios]
      summary: Perfil propio
      operationId: getUsuariosMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioMe'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/usuarios/me/horario:
    get:
      tags: [Usuarios]
      summary: Horario semanal propio
      operationId: getUsuariosMeHorario
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Horario del docente autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Horario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/usuarios/{id}/horario:
    get:
      tags: [Usuarios]
      summary: Horario semanal de un docente
      operationId: getUsuarioHorario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Horario del docente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Horario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtener un usuario
      operationId: getUsuario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Usuarios]
      summary: Modificacion parcial de usuario
      description: Ejemplo de uso — aprobar alta pendiente (`estado: activo`).
      operationId: patchUsuario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioPatch'
            example:
              estado: activo
              departamento: Informatica
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/anuncios:
    get:
      tags: [Anuncios]
      summary: Feed del tablón
      operationId: listAnuncios
      security:
        - BearerAuth: []
      parameters:
        - name: departamento
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de anuncios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Anuncio'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Anuncios]
      summary: Publicar anuncio
      operationId: createAnuncio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnuncioCreate'
      responses:
        '201':
          description: Anuncio creado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Anuncio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/anuncios/{id}/fijar:
    patch:
      tags: [Anuncios]
      summary: Fijar o desfijar anuncio
      operationId: fijarAnuncio
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fijado]
              properties:
                fijado:
                  type: boolean
      responses:
        '200':
          description: Estado de fijado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/guardias:
    get:
      tags: [Guardias]
      summary: Consultar cuadrante
      operationId: listGuardias
      security:
        - BearerAuth: []
      parameters:
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-10-02"
        - name: franja
          in: query
          required: false
          schema:
            type: string
          description: Identificador de franja horaria
      responses:
        '200':
          description: Lista de guardias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guardia'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/guardias/asignar:
    post:
      tags: [Guardias]
      summary: Ejecutar asignación por rondas
      description: |
        Acción de negocio. La lógica vive en `services/guardias_service`.
        Detalle del algoritmo: pendiente de implementacion (Fase 3).
      operationId: asignarGuardias
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardiaAsignarRequest'
      responses:
        '200':
          description: Asignación ejecutada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/guardias/{id}:
    patch:
      tags: [Guardias]
      summary: Modificar docente que cubre la guardia
      operationId: patchGuardia
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardiaPatch'
      responses:
        '200':
          description: Guardia actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/ausencias:
    post:
      tags: [Ausencias]
      summary: Registrar ausencia
      operationId: createAusencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AusenciaCreate'
            example:
              tipo: generica
              fecha_inicio: "2026-10-03"
              fecha_fin: "2026-10-03"
              motivo: Visita medica
      responses:
        '201':
          description: Ausencia creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAck'
              example:
                code: 201
                msg: La operacion se ha realizado correctamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/ausencias/{id}/justificante:
    post:
      tags: [Ausencias]
      summary: Subir justificante
      description: Requiere ser dueño de la ausencia (propiedad, no rol).
      operationId: uploadJustificante
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Justificante asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/ausencias/{id}/pdf:
    get:
      tags: [Ausencias]
      summary: Descargar PDF de la ausencia
      description: Requiere ser dueño de la ausencia.
      operationId: getAusenciaPdf
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Documento PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ausencias/{id}/firma:
    post:
      tags: [Ausencias]
      summary: Insertar firma
      description: |
        Firma manuscrita/electrónica (AutoFirma u otro mecanismo).
        **PENDIENTE DE DECISIÓN:** formato exacto del payload de firma.
      operationId: firmarAusencia
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmaRequest'
      responses:
        '200':
          description: Firma registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tickets:
    get:
      tags: [Tickets]
      summary: Listar tickets
      operationId: listTickets
      security:
        - BearerAuth: []
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketTipo'
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TicketEstado'
      responses:
        '200':
          description: Lista de tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tickets]
      summary: Crear ticket
      operationId: createTicket
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: Ticket creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAck'
              example:
                code: 201
                msg: La operacion se ha realizado correctamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tickets/{id}:
    patch:
      tags: [Tickets]
      summary: Transición de estado del ticket
      description: |
        Máquina de estados: `abierto` → `en_proceso` → `resuelto` → `cerrado`.
        Transiciones inválidas → 422.
      operationId: patchTicket
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketPatch'
      responses:
        '200':
          description: Ticket actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/tickets/{id}/comentarios:
    get:
      tags: [Tickets]
      summary: Listar comentarios del ticket
      operationId: listTicketComentarios
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Hilo de comentarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comentario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tickets]
      summary: Añadir comentario
      operationId: createTicketComentario
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComentarioCreate'
      responses:
        '201':
          description: Comentario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/fem/alumnos:
    get:
      tags: [FEM]
      summary: Alumnado FEM asignado
      description: Formación en Empresas Murcia. No usar `/fct`.
      operationId: listFemAlumnos
      security:
        - BearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de alumnos FEM
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FemAlumno'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/fem/alumnos/{id}/horas:
    patch:
      tags: [FEM]
      summary: Actualizar horas cursadas
      description: Progreso sobre 500 horas de prácticas.
      operationId: patchFemAlumnoHoras
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FemHorasPatch'
      responses:
        '200':
          description: Horas actualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/dashboard/kpis:
    get:
      tags: [Dashboard]
      summary: KPIs del centro
      operationId: getDashboardKpis
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Métricas consolidadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardKpis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /health:
    get:
      tags: [Health]
      summary: Liveness
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Proceso vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness
      description: Comprueba disponibilidad de MongoDB y Redis.
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Dependencias listas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  mongo:
                    type: boolean
                  redis:
                    type: boolean
        '503':
          description: Dependencias no disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UsuarioId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador del usuario (codificado en la URL)
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador del recurso (codificado en la URL)
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10

  responses:
    BadRequest:
      description: Peticion incorrecta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Peticion incorrecta
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: No autenticado
    Forbidden:
      description: Sin permisos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Se requiere uno de estos roles: admin
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: Recurso no encontrado
    Conflict:
      description: Conflicto (duplicado, solapamiento o transicion no valida)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
          example:
            detail: El recurso ya existe
    UnprocessableEntity:
      description: Validacion fallida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'

  schemas:
    Role:
      type: string
      enum:
        - admin
        - directiva
        - jefatura
        - docente
        - tutor
        - responsable_ticket

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          description: Mensaje o lista de errores de validacion (estilo FastAPI)

    DetailMessage:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ResourceAck:
      type: object
      description: Respuesta generica de accion de negocio (modulos pendientes)
      additionalProperties: true

    GoogleAuthRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: ID token JWT emitido por Google Identity Services

    AccessTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Segundos de validez del access token

    UsuarioEstado:
      type: string
      enum: [pendiente, activo, inactivo]

    Usuario:
      type: object
      required: [id, name, email, departamento, roles, estado]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        estado:
          $ref: '#/components/schemas/UsuarioEstado'

    UsuarioPaginated:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    UsuarioCreate:
      type: object
      required: [name, email, departamento]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          default: [docente]
        estado:
          $ref: '#/components/schemas/UsuarioEstado'
          default: activo

    UsuarioMe:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            permisos:
              type: array
              items:
                type: string

    UsuarioPatch:
      type: object
      properties:
        name:
          type: string
        departamento:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        estado:
          $ref: '#/components/schemas/UsuarioEstado'

    BloqueHorario:
      type: object
      required: [inicio, fin, tipo]
      properties:
        inicio:
          type: string
          example: "08:00"
        fin:
          type: string
          example: "09:00"
        tipo:
          type: string
          enum: [clase, guardia, reduccion]
        asignatura:
          type: string
        grupo:
          type: string
        aula:
          type: string

    Horario:
      type: object
      required: [usuario_id, dias]
      properties:
        usuario_id:
          type: string
        dias:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/BloqueHorario'
          description: Mapa dia -> bloques (lunes, martes, ...)

    Anuncio:
      type: object
      required: [id, titulo, cuerpo]
      properties:
        id:
          type: string
        titulo:
          type: string
        cuerpo:
          type: string
        departamento:
          type: string
          nullable: true
        fijado:
          type: boolean
          default: false
        expira_en:
          type: string
          format: date-time
          nullable: true
        creado_en:
          type: string
          format: date-time

    AnuncioCreate:
      type: object
      required: [titulo, cuerpo]
      properties:
        titulo:
          type: string
        cuerpo:
          type: string
        departamento:
          type: string
          nullable: true
        expira_en:
          type: string
          format: date-time
          nullable: true

    Guardia:
      type: object
      required: [id, fecha, franja]
      properties:
        id:
          type: string
        fecha:
          type: string
          format: date
        franja:
          type: string
        ausente_id:
          type: string
          nullable: true
        cubre_id:
          type: string
          nullable: true
        estado:
          type: string
          enum: [pendiente, asignada, cubierta]

    GuardiaAsignarRequest:
      type: object
      properties:
        fecha:
          type: string
          format: date
        franja:
          type: string

    GuardiaPatch:
      type: object
      properties:
        cubre_id:
          type: string
        estado:
          type: string
          enum: [pendiente, asignada, cubierta]

    AusenciaTipo:
      type: string
      enum: [generica, administrativa, extraescolar]

    AusenciaCreate:
      type: object
      required: [tipo, fecha_inicio, fecha_fin]
      properties:
        tipo:
          $ref: '#/components/schemas/AusenciaTipo'
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type: string
          format: date
        motivo:
          type: string

    FirmaRequest:
      type: object
      properties:
        firma_base64:
          type: string
          description: Imagen o payload de firma (formato PENDIENTE DE DECISIÓN)
        proveedor:
          type: string
          example: autofirma

    TicketTipo:
      type: string
      enum: [rmi, rrss, compras, otro]

    TicketEstado:
      type: string
      enum: [abierto, en_proceso, resuelto, cerrado]
      description: |
        Transiciones válidas: abierto → en_proceso → resuelto → cerrado.

    Ticket:
      type: object
      required: [id, tipo, estado, titulo]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TicketTipo'
        estado:
          $ref: '#/components/schemas/TicketEstado'
        titulo:
          type: string
        descripcion:
          type: string
        solicitante_id:
          type: string
        asignado_id:
          type: string
          nullable: true
        creado_en:
          type: string
          format: date-time

    TicketCreate:
      type: object
      required: [tipo, titulo]
      properties:
        tipo:
          $ref: '#/components/schemas/TicketTipo'
        titulo:
          type: string
        descripcion:
          type: string

    TicketPatch:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/TicketEstado'
        asignado_id:
          type: string

    Comentario:
      type: object
      required: [id, autor_id, cuerpo, creado_en]
      properties:
        id:
          type: string
        autor_id:
          type: string
        cuerpo:
          type: string
        creado_en:
          type: string
          format: date-time

    ComentarioCreate:
      type: object
      required: [cuerpo]
      properties:
        cuerpo:
          type: string
          minLength: 1

    FemAlumno:
      type: object
      required: [id, nombre, horas_cursadas, horas_totales]
      properties:
        id:
          type: string
        nombre:
          type: string
        empresa:
          type: string
        estado:
          type: string
        horas_cursadas:
          type: number
          minimum: 0
        horas_totales:
          type: number
          example: 500
        tutor_id:
          type: string

    FemHorasPatch:
      type: object
      required: [horas_cursadas]
      properties:
        horas_cursadas:
          type: number
          minimum: 0
          maximum: 500

    DashboardKpis:
      type: object
      properties:
        ausencias_hoy:
          type: integer
        guardias_pendientes:
          type: integer
        tickets_abiertos:
          type: integer
        docentes_activos:
          type: integer
        alumnos_fem_activos:
          type: integer

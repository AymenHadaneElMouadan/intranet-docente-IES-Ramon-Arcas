# Stub de orquestación local — Intranet Docente

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - mongo
      - redis
    volumes:
      # Montaje en desarrollo: cambios de código sin rebuild (opcional)
      - ./backend/app:/app/app

volumes:
  mongo_data:
